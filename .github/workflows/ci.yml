# ──────────────────────────────────────────────────────────────────────────
# CI — Basic backend sanity check on every push / pull request.
# Installs dependencies and confirms the app imports without errors.
# ──────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-check:
    name: Backend — import check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify app imports correctly
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key-not-real
          TELEGRAM_BOT_TOKEN: "000000000:placeholder"
          TELEGRAM_BOT_USERNAME: TestBot
          TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
        run: python -c "from app.main import app; print('App loaded OK')"
