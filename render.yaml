# Render deployment configuration (render.yaml)
# Docs: https://render.com/docs/render-yaml-reference
#
# This file deploys:
#   - backend  : Python FastAPI web service (Starter plan — $7/mo, always-on)
#   - frontend : React static site (free)

services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: gold-price-watcher-api
    runtime: python
    region: oregon          # change to frankfurt / singapore if closer to Ethiopia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping

    envVars:
      - key: DATABASE_URL
        # Keep SQLite for a quick start (data resets on redeploy).
        # For persistent storage, add a Postgres service and use its internal URL.
        value: sqlite:///./gold_watcher.db

      - key: SECRET_KEY
        generateValue: true

      - key: TELEGRAM_BOT_TOKEN
        sync: false           # set this in the Render dashboard

      - key: TELEGRAM_BOT_USERNAME
        sync: false

      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      - key: FETCH_INTERVAL_HOURS
        value: "12"

      - key: CORS_ORIGINS
        # Update this to your actual frontend URL after first deploy
        value: https://gold-price-watcher.onrender.com,http://localhost:5173

  # ── Frontend (React / Vite static site) ─────────────────────────────────
  - type: web
    name: gold-price-watcher
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    # SPA fallback — all routes served by index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://gold-price-watcher-api.onrender.com

  # ── PostgreSQL (optional — recommended for production) ───────────────────
  # Uncomment to add a managed Postgres database.
  # Then update DATABASE_URL on the backend to use the internal DB URL.
  #
  # - type: pserv
  #   name: gold-price-watcher-db
  #   plan: free
  #   region: oregon
  #   databaseName: gold_watcher
  #   databaseUser: gold_user
