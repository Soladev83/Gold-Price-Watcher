# Render deployment configuration (render.yaml)
# Docs: https://render.com/docs/render-yaml-reference
#
# This file deploys:
#   - backend  : Python FastAPI web service
#   - frontend : React static site
#
# Place this file at the repo root and connect the repo in the Render dashboard.

services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: gold-price-watcher-api
    runtime: python
    region: oregon          # change to frankfurt / singapore if closer to Ethiopia
    plan: free              # upgrade to starter ($7/mo) for always-on
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping

    envVars:
      # Set these in the Render dashboard under Environment → Secret Files
      # or add them as individual env vars. Never commit real values here.
      - key: DATABASE_URL
        # For free tier use the Render-provided PostgreSQL URL (add a Postgres service below)
        # or keep SQLite for a quick start (data resets on every deploy with SQLite).
        value: sqlite:///./gold_watcher.db   # replace with Render Postgres URL in production

      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value

      - key: TELEGRAM_BOT_TOKEN
        sync: false           # fill in the Render dashboard — never committed

      - key: TELEGRAM_BOT_USERNAME
        sync: false

      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      - key: FETCH_INTERVAL_HOURS
        value: "12"

      - key: CORS_ORIGINS
        # Replace with your actual Render frontend URL after first deploy
        value: https://gold-price-watcher.onrender.com,http://localhost:5173

  # ── Frontend (React / Vite static site) ─────────────────────────────────
  - type: web
    name: gold-price-watcher
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    # SPA fallback — all routes served by index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Vite needs the backend URL at build time for the API proxy
      - key: VITE_API_BASE_URL
        value: https://gold-price-watcher-api.onrender.com

  # ── PostgreSQL (optional — recommended for production) ───────────────────
  # Uncomment this block to add a managed Postgres database.
  # Then set DATABASE_URL on the backend service to the internal DB URL.
  #
  # - type: pserv
  #   name: gold-price-watcher-db
  #   plan: free
  #   region: oregon
  #   databaseName: gold_watcher
  #   databaseUser: gold_user
